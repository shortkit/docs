<style>
/* Viewfinder intro, matching the site: the logo starts as the compact ⌜sk⌟ mark. First the space opens (the k
   and the right bracket glide out, "sk" crisp throughout); then the missing letters settle in, one by one, whole. */
@keyframes k-in { from { transform: translateX(-1912px); } to { transform: none; } }
@keyframes br-in { from { transform: translateX(-2478px); } to { transform: none; } }
@keyframes letter { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }
.k { animation: k-in .7s .45s cubic-bezier(.65,0,.35,1) both; }
.br { animation: br-in .7s .45s cubic-bezier(.65,0,.35,1) both; }
.l { animation: letter .45s cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .k, .br, .l { animation: none; } }
</style>
